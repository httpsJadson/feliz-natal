<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Tree</title>
<style>
:root{--bg:#000;--fg:#9aa0a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#9aa0a6}}
:root[data-theme="dark"]{--bg:#000;--fg:#9aa0a6}
html,body{height:100%;margin:0;background:var(--bg)}
#stage{width:100%;height:100%;position:relative;overflow:hidden;cursor:pointer}
canvas{display:block}
#hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:12px/1 monospace;color:var(--fg);opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hint">Toque para reiniciar</div></div>
<script>
(()=>{
const stage=document.getElementById('stage'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
let W,H,cw,ch,fs,cols,rows,dpr,k,ox,oy,flakes=[];
const RAMP=".,:;+=xX#%@";
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eo=t=>1-Math.pow(1-t,3);
const eb=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const hw=y=>clamp((y-240)/900,0,1)*430+10;
function hash(i,j,f){let h=Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(f,1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
let seed=7;const R=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);

// dados da cena
const tiers=[[260,480,150],[380,660,220],[520,840,290],[680,1010,360],[840,1170,430]];
const pal=['#e0262f','#f2b632','#2f6fe0','#e65aa8','#d8dde6','#e0262f','#f2b632'];
const orn=[];
for(let i=0;i<46;i++){const y=340+R()*780,w=hw(y)*.82;orn.push({x:500+(R()*2-1)*w,y,r:17+(y-300)/800*15,c:pal[i%pal.length],t:6.5+i*.13})}
const gifts=[
 {x:215,y:1120,w:110,h:130,c:'#7b3fb8'},{x:330,y:1215,w:150,h:160,c:'#2f9a3a'},
 {x:520,y:1265,w:120,h:105,c:'#d92b2b'},{x:675,y:1215,w:130,h:160,c:'#2f6fe0'},
 {x:790,y:1130,w:140,h:150,c:'#d92b2b'}];

function resize(){
  W=stage.clientWidth;H=stage.clientHeight;dpr=Math.min(devicePixelRatio||1,2);
  cw=W<700?5:6;fs=cw/0.6;ch=Math.round(fs);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);sc.width=cols;sc.height=rows;
  k=Math.min(W/1000,H/1400)*0.96;ox=(W-1000*k)/2;oy=(H-1400*k)/2;
  flakes=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.6,v:15+Math.random()*30,p:Math.random()*6}));
}

function tier(t,i){
  const[a,b,w]=t,ry=w*.2;
  const g=sx.createLinearGradient(500-w,0,500+w,0);
  g.addColorStop(0,'#0a3a10');g.addColorStop(.45,i%2?'#2f9a3c':'#38a846');g.addColorStop(1,'#124f1b');
  sx.fillStyle=g;sx.beginPath();sx.moveTo(500,a);sx.lineTo(500-w,b);
  sx.ellipse(500,b,w,ry,0,Math.PI,0,true);sx.closePath();sx.fill();
  sx.strokeStyle='rgba(0,25,0,.55)';sx.lineWidth=12;sx.beginPath();
  sx.ellipse(500,b,w*.97,ry,0,Math.PI*.1,Math.PI*.9);sx.stroke();
}
function garland(t){
  const p=clamp((t-3.2)/2.2);if(!p)return;
  sx.lineCap='round';sx.lineWidth=15;
  const N=240,turns=5.2;let prev=null;
  for(let i=0;i<=N*p;i++){
    const q=i/N,y=300+q*850,w=hw(y)*.92,a=q*turns*6.2832,c=Math.cos(a);
    const x=500+Math.sin(a)*w,yy=y+c*w*.16;
    if(c>0){if(prev){sx.strokeStyle=(i%14<7)?'#e0303a':'#f4a3a8';sx.beginPath();sx.moveTo(prev[0],prev[1]);sx.lineTo(x,yy);sx.stroke()}prev=[x,yy]}else prev=null;
  }
}
function scene(t){
  sx.setTransform(1,0,0,1,0,0);sx.clearRect(0,0,cols,rows);
  sx.setTransform(1/cw,0,0,1/ch,0,0);sx.translate(ox,oy);sx.scale(k,k);
  // base de neve
  const bp=eo(clamp((t-.2)/1));
  if(bp>0){sx.save();sx.globalAlpha=bp;sx.translate(500,1190);sx.scale(.6+.4*bp,.6+.4*bp);
    const g=sx.createLinearGradient(-480,0,480,0);g.addColorStop(0,'#aeb4be');g.addColorStop(.5,'#eef1f5');g.addColorStop(1,'#98a0ac');
    sx.fillStyle=g;sx.beginPath();sx.ellipse(0,0,480,110,0,0,7);sx.fill();sx.restore()}
  // árvore crescendo
  const s=eo(clamp((t-.8)/2.2));
  if(s>0){sx.save();sx.translate(500,1160);sx.scale(s,s);sx.translate(-500,-1160);
    for(let i=tiers.length-1;i>=0;i--)tier(tiers[i],i);
    garland(t);sx.restore()}
  // bolas
  for(const o of orn){
    const p=clamp((t-o.t)/.35);if(!p)continue;const z=eb(p);
    sx.save();sx.translate(o.x,o.y);sx.scale(z,z);
    sx.fillStyle=o.c;sx.beginPath();sx.arc(0,0,o.r,0,7);sx.fill();
    const g=sx.createRadialGradient(-o.r*.35,-o.r*.35,1,0,0,o.r);
    g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(0,0,0,.35)');
    sx.fillStyle=g;sx.fill();
    sx.fillStyle='#f0b429';sx.fillRect(-o.r*.25,-o.r*1.25,o.r*.5,o.r*.35);sx.restore();
  }
  // presentes
  gifts.forEach((g,i)=>{
    const p=clamp((t-(4.4+i*.45))/.5);if(!p)return;
    sx.save();sx.translate(g.x,g.y+(1-eb(p))*-260);sx.globalAlpha=Math.min(1,p*3);
    sx.fillStyle=g.c;sx.fillRect(-g.w/2,-g.h,g.w,g.h);
    sx.fillStyle='rgba(0,0,0,.28)';sx.fillRect(g.w*.15,-g.h,g.w*.35,g.h);
    sx.fillStyle='#f0b429';sx.fillRect(-g.w*.09,-g.h,g.w*.18,g.h);sx.fillRect(-g.w/2,-g.h*.55,g.w,g.h*.16);
    sx.beginPath();sx.ellipse(-g.w*.15,-g.h-8,g.w*.17,g.h*.1,-.4,0,7);sx.fill();
    sx.beginPath();sx.ellipse(g.w*.15,-g.h-8,g.w*.17,g.h*.1,.4,0,7);sx.fill();sx.restore();
  });
  // estrela
  const st=clamp((t-3.4)/.6);
  if(st>0){const z=eb(st)*(1+.04*Math.sin(t*4));
    sx.save();sx.translate(500,238);sx.scale(z,z);sx.beginPath();
    for(let i=0;i<10;i++){const r=i%2?32:72,a=-Math.PI/2+i*Math.PI/5;sx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    sx.closePath();const g=sx.createLinearGradient(-70,-70,70,70);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#d9941a');
    sx.fillStyle=g;sx.fill();sx.restore()}
}

function render(t,fade,frame){
  scene(t);
  const d=sx.getImageData(0,0,cols,rows).data;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.font=fs+'px monospace';ctx.textBaseline='top';ctx.globalAlpha=fade;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const n=(j*cols+i)*4,a=d[n+3];if(a<30)continue;
    const hs=hash(i,j,0),hd=hash(i,j,frame),f=(.8+.4*hs)*1.15;
    const lum=(a/255)*Math.max(d[n],d[n+1],d[n+2])/255;
    const idx=Math.min(RAMP.length-1,(lum*(.75+.5*hd)*RAMP.length)|0);
    ctx.fillStyle=`rgb(${Math.min(255,d[n]*f)|0},${Math.min(255,d[n+1]*f)|0},${Math.min(255,d[n+2]*f)|0})`;
    ctx.fillText(RAMP[idx],i*cw,j*ch);
  }
}

let t0=performance.now(),last=0;const DUR=19;
function loop(now){
  requestAnimationFrame(loop);
  if(now-last<40)return;
  const dt=Math.min(.1,(now-last)/1000);last=now;
  let t=(now-t0)/1000;if(t>DUR){t0=now;t=0}
  render(t,t>17?clamp(1-(t-17)/1.6):1,Math.floor(t*6));
  ctx.globalAlpha=.85;ctx.fillStyle='#fff';
  for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(now/1000+f.p)*8*dt;if(f.y>H){f.y=-4;f.x=Math.random()*W}ctx.fillRect(f.x,f.y,f.r,f.r)}
}
stage.addEventListener('click',()=>{t0=performance.now()});
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
